baseURL: https://henockt.github.io/
locale: en-us
title: henockt
theme: PaperMod
enableRobotsTXT: true
disableKinds: [taxonomy, term, rss]

outputs:
  home: [HTML]

params:
  env: production
  description: "Henock, software engineer working in Go and TypeScript."
  author: Henock
  tagline: Software Engineer
  defaultTheme: auto
  mainSections: [projects]
  ShowReadingTime: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  hideMeta: true
  ShowShareButtons: false
  hideFooter: false

  homeInfoParams:
    Title: "Hi, I'm Henock. I build backend systems and AI infrastructure."
    Content: >
      I write clear code, test carefully, and build reliable APIs and secure systems
      grounded in data structures and algorithms. I’m drawn to problems that sit close
      to the network (proxies, tunnels, mail routing) and to code that stays correct
      under concurrency. Currently exploring scalable API design, distributed systems,
      and inference pipelines.


      **Stack:** Go · TypeScript · Python · PostgreSQL · Docker

  socialIcons:
    - name: github
      url: https://github.com/henockt

  images: [/images/og.png]

  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
    safari_pinned_tab: /safari-pinned-tab.svg

  cover:
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 20
    - identifier: github
      name: ""
      title: GitHub
      url: https://github.com/henockt
      weight: 30
      params:
        icon: github

markup:
  goldmark:
    renderer:
      unsafe: true
