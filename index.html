<html lang="en">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="files/styles.css">
    <script src="https://kit.fontawesome.com/8be913572e.js" crossorigin="anonymous"></script>

</head>
<body>
    <!-- PRELOADER -->
    <!-- <div class="preloader">

    <!-- PARTICLES -->
    <div id="particles-js"></div>
    
    <div class="front">
        <header>
            <img src="files/bg.jpg" alt="Henock" class="avatar">
            <h1 class="name">Henock</h1>
        </header>

        <div class="right">
            <main>
                <p>Hey There! I'm Henock, a backend engineer focused on reliable APIs and secure systems. Currently exploring the complexities of scalable API design and distributed systems.</p>
            </main>

            <ul class="social">
                    <a href="https://github.com/henockt" class="social-link">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="mailto:contacthenockd@gmail.com" class="social-link">
                        <i class="fas fa-envelope"></i>
                    </a>
            </ul>

            <ul class="links">
                <a class="projects">Some of my projects: </a>
                <a href="https://github.com/henockt/relay" title="This app is hosted on GCP">relay</a>

            </ul>
        </div>
    </div>

    <script src="files/particles.min.js"></script>
    <script src="files/app.js"></script>
    <script type="text/javascript">

        // random function
        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }         

        const elt = document.querySelector(".name");
        const howto = document.querySelector(".howto");
        const pd = document.querySelector(".preloader");
        document.onreadystatechange = () => {
            if (document.readyState === "complete") {
                pd.style.display = "none";
                elt.classList.add("animate__animated", "animate__slow", "animate__flipInX");
                howto.classList.add("animate__animated", "animate__slow", "animate__flipInX");
            }
        };

        const list = ["how to program", "how computers function", "how the internet works"];
        howto.innerHTML = list[getRandomInt(list.length)];
    </script>
</body>
